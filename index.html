<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="theme-color" content="#080c10"/>
<title>Don Hendric Inventory</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--bg:#080c10;--surface:#0d1117;--border:#1c2030;--text:#dde2ea;--muted:#64748b;--green:#34d399;--green-bg:#064e3b;--green-dim:#0d2818;--amber:#fbbf24;--amber-bg:#451a03;--red:#f87171;--red-bg:#7f1d1d;--blue:#3b82f6;--blue-bg:#1e3a8a;--radius:8px}
body{font-family:'Syne',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}
button,input,select,textarea{font-family:'Syne',sans-serif;cursor:pointer}
#header{background:var(--surface);border-bottom:1px solid var(--border);padding:16px;position:sticky;top:0;z-index:50}
.brand-tag{font-size:10px;color:var(--green);font-weight:700;letter-spacing:2px;margin-bottom:2px}
.brand-title{font-size:19px;font-weight:800;letter-spacing:-0.5px}
.brand-sub{font-size:11px;color:var(--muted);margin-top:1px}
.overdue-banner{margin-top:8px;background:var(--red-bg);border:1px solid var(--red);border-radius:8px;padding:6px 10px;font-size:12px;color:var(--red);font-weight:700}
#bottom-nav{position:fixed;bottom:0;left:0;right:0;width:100%;background:var(--surface);border-top:1px solid var(--border);display:flex;z-index:50}
.nav-btn{flex:1;background:none;border:none;padding:11px 0 9px;display:flex;flex-direction:column;align-items:center;gap:3px}
.nav-btn .nav-icon{font-size:18px}
.nav-btn .nav-label{font-size:10px;color:var(--muted);font-weight:400;letter-spacing:0.5px}
.nav-btn.active .nav-label{color:var(--green);font-weight:700}
.nav-dot{width:20px;height:2px;border-radius:1px;background:var(--green);margin-top:-1px}
.page{display:none;padding:14px 90px}
.page.active{display:block}
#page-inventory{padding:0 0 90px}
.page-content{max-width:1200px;margin:0 auto}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px;margin-bottom:14px}
.stat-card{background:var(--surface);border-radius:var(--radius);padding:12px 10px;text-align:center}
.stat-num{font-size:24px;font-weight:900;line-height:1.1}
.stat-lbl{font-size:10px;color:var(--muted);margin-top:2px}
.revenue-card{background:linear-gradient(135deg,var(--green-dim),var(--bg));border:1px solid #166534;border-radius:12px;padding:14px 16px;margin-bottom:14px}
.revenue-tag{font-size:10px;color:var(--green);font-weight:700;letter-spacing:1.5px}
.revenue-num{font-size:28px;font-weight:900;color:var(--green);letter-spacing:-1px;margin-top:2px}
.revenue-sub{font-size:11px;color:#166534;margin-top:2px}
.sec-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.sec-title{font-weight:700;font-size:14px}
.item-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:11px 13px;margin-bottom:8px}
.card-top{display:flex;justify-content:space-between;align-items:flex-start}
.card-id{font-size:11px;color:var(--blue);font-weight:700;background:var(--blue-bg);border-radius:4px;padding:1px 5px;margin-right:6px;font-family:'DM Mono',monospace}
.card-name{font-weight:700;font-size:13px}
.card-meta{font-size:11px;color:var(--muted);margin-top:2px}
.card-spec{font-size:10px;color:#4b5563;margin-top:1px;font-style:italic}
.status-badge{border-radius:6px;padding:2px 8px;font-size:10px;font-weight:700;white-space:nowrap;margin-left:6px}
.badge-available{background:var(--green-bg);color:var(--green)}
.badge-rented{background:var(--amber-bg);color:var(--amber)}
.badge-maintenance{background:var(--red-bg);color:var(--red)}
.card-bottom{display:flex;justify-content:space-between;align-items:center;margin-top:9px;flex-wrap:wrap;gap:8px}
.card-rate{color:var(--amber);font-weight:800;font-size:14px}
.card-rate span{color:var(--muted);font-size:10px;font-weight:400}
.card-qty{color:var(--muted);font-size:11px;margin-left:8px}
.btn-row{display:flex;gap:6px}
.btn-sm{border:1px solid var(--border);color:#94a3b8;background:var(--border);border-radius:7px;padding:4px 10px;font-size:11px}
.btn-green{background:var(--green);color:#000;border:none;border-radius:7px;padding:4px 10px;font-size:11px;font-weight:700}
.btn-amber{background:var(--amber);color:#000;border:none;border-radius:7px;padding:4px 10px;font-size:11px;font-weight:700}
.rental-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:11px 13px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:flex-start}
.rental-card-left{flex:1}
.r-name{font-weight:700;font-size:13px}
.r-customer{font-size:11px;color:#94a3b8;margin-top:2px}
.r-dates{font-size:10px;color:var(--muted);margin-top:2px}
.r-right{text-align:right}
.r-amount{font-size:15px;font-weight:900;color:var(--green)}
.r-days{font-size:9px;color:#4b5563}
.btn-return{margin-top:8px;width:100%;background:var(--green);color:#000;border:none;border-radius:7px;padding:7px;font-weight:800;font-size:12px}
#inv-toolbar{background:var(--surface);border-bottom:1px solid var(--border);padding:12px 14px 10px;position:sticky;top:61px;z-index:40}
.search-row{display:flex;gap:8px;margin-bottom:8px}
.search-input{flex:1;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:8px 12px;color:var(--text);font-size:13px;outline:none;min-width:200px}
.search-input:focus{border-color:var(--green)}
.btn-add{background:var(--green);color:#000;border:none;border-radius:8px;padding:8px 14px;font-weight:800;font-size:14px}
.chip-row{display:flex;gap:5px;overflow-x:auto;padding-bottom:3px;scrollbar-width:none;flex-wrap:wrap}
.chip-row::-webkit-scrollbar{display:none}
.chip{background:var(--bg);color:var(--muted);border:1px solid var(--border);border-radius:20px;padding:3px 10px;font-size:11px;font-weight:600;white-space:nowrap}
.chip.active-green{background:var(--green);color:#000;border-color:var(--green)}
.chip.active-blue{background:var(--blue-bg);color:var(--blue);border-color:var(--blue)}
.inv-list{padding:8px 14px}
.inv-count{font-size:11px;color:var(--muted);margin-bottom:8px}
#rent-toolbar{background:var(--surface);border-bottom:1px solid var(--border);padding:12px 14px 10px}
.rent-header-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.75);z-index:100;align-items:flex-end;justify-content:center}
.modal-overlay.open{display:flex}
.modal-sheet{background:var(--surface);border-radius:18px 18px 0 0;width:100%;max-width:600px;margin:0 auto;padding:18px 16px 40px;max-height:90vh;overflow-y:auto}
@media(min-width:769px){
  .modal-sheet{border-radius:18px;max-height:80vh}
  .page{padding:20px}
  #inv-toolbar{top:80px}
  body{margin:0 auto}
  #header{padding:20px}
}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.modal-title{font-weight:800;font-size:16px}
.modal-close{background:var(--border);border:none;color:#94a3b8;width:28px;height:28px;border-radius:7px;font-size:14px}
.field{margin-bottom:12px}
.field-label{font-size:10px;color:var(--muted);margin-bottom:4px;font-weight:700;letter-spacing:1px;display:block}
.field-input{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:10px 12px;color:var(--text);font-size:13px;outline:none}
.field-input:focus{border-color:var(--green)}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.total-box{background:var(--green-dim);border:1px solid #166534;border-radius:10px;padding:12px 14px;margin-bottom:12px}
.total-calc{color:var(--muted);font-size:12px}
.total-amount{color:var(--green);font-weight:900;font-size:20px;margin-top:2px}
.btn-primary{width:100%;background:var(--green);color:#000;border:none;border-radius:10px;padding:13px;font-weight:800;font-size:14px;margin-bottom:8px}
.btn-danger{width:100%;background:transparent;color:var(--red);border:1px solid rgba(248,113,113,0.35);border-radius:10px;padding:11px;font-weight:700;font-size:13px}
.summary-box{background:var(--bg);border-radius:var(--radius);padding:12px 14px;margin-bottom:14px}
.summary-row{display:flex;justify-content:space-between;font-size:12px;margin-bottom:5px}
.summary-row .lbl{color:var(--muted)}
.summary-divider{border-top:1px solid var(--border);padding-top:8px;margin-top:4px;display:flex;justify-content:space-between;align-items:center}
.summary-total{font-weight:900;font-size:20px;color:var(--green)}
.empty{text-align:center;padding:36px 20px;color:#4b5563}
.empty-icon{font-size:36px;margin-bottom:8px}
.empty-txt{font-size:13px}
.overdue-section{background:#0e0505;border:1px solid var(--red);border-radius:12px;padding:12px 14px;margin-bottom:14px}
.overdue-title{color:var(--red);font-weight:700;font-size:13px;margin-bottom:8px}
.overdue-item{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.overdue-info .name{font-size:13px;font-weight:600}
.overdue-info .sub{font-size:11px;color:#94a3b8}
@media(max-width:768px){
  .page{padding:14px 14px 90px}
  #header{padding:16px 16px 12px}
  .stat-grid{grid-template-columns:1fr 1fr 1fr}
}
@media(min-width:769px){
  #bottom-nav{position:static;border-top:none;padding:0;flex-direction:row;justify-content:flex-end;gap:20px}
  .nav-btn{flex:none;padding:0;background:none}
  .nav-dot{display:none}
  .page{padding:20px}
  .stat-grid{grid-template-columns:repeat(3,1fr)}
}
</style>
</head>
<body>
<div id="header">
  <div class="brand-tag">DON HENDRIC WATER TECH &amp; ENGINEERING</div>
  <div class="brand-title">Inventory Manager</div>
  <div class="brand-sub" id="item-count-sub">0 items</div>
  <div class="overdue-banner" id="overdue-banner" style="display:none"></div>
</div>
<div id="page-dashboard" class="page active">
  <div class="page-content">
    <div class="stat-grid">
      <div class="stat-card" style="border:1px solid rgba(52,211,153,0.3)"><div class="stat-num" style="color:var(--green)" id="stat-available">0</div><div class="stat-lbl">Available</div></div>
      <div class="stat-card" style="border:1px solid rgba(251,191,36,0.3)"><div class="stat-num" style="color:var(--amber)" id="stat-rented">0</div><div class="stat-lbl">Rented</div></div>
      <div class="stat-card" style="border:1px solid rgba(248,113,113,0.3)"><div class="stat-num" style="color:var(--red)" id="stat-maint">0</div><div class="stat-lbl">Maintenance</div></div>
    </div>
    <div class="revenue-card">
      <div class="revenue-tag">THIS MONTH REVENUE</div>
      <div class="revenue-num" id="dash-revenue">0 <span style="font-size:14px;font-weight:400">LKR</span></div>
      <div class="revenue-sub" id="dash-active-count">0 active rentals</div>
    </div>
    <div id="dash-overdue-section"></div>
    <div class="sec-header">
      <div class="sec-title">Active Rentals</div>
      <button class="btn-amber" style="padding:6px 14px;font-size:12px;font-weight:800;border:none;border-radius:8px" onclick="openNewRental()">+ New</button>
    </div>
    <div id="dash-active-list"></div>
  </div>
</div>
<div id="page-inventory">
  <div id="inv-toolbar">
    <div class="search-row">
      <input class="search-input" id="search-input" placeholder="Search name, ID, size…" oninput="renderInventory()"/>
      <button class="btn-add" onclick="openEditItem(null)">+</button>
    </div>
    <div class="chip-row" id="status-chips">
      <button class="chip active-green" data-status="All" onclick="setStatusFilter(this)">All</button>
      <button class="chip" data-status="available" onclick="setStatusFilter(this)">Available</button>
      <button class="chip" data-status="rented" onclick="setStatusFilter(this)">Rented</button>
      <button class="chip" data-status="maintenance" onclick="setStatusFilter(this)">Maintenance</button>
    </div>
    <div class="chip-row" id="cat-chips" style="margin-top:5px"></div>
  </div>
  <div class="inv-list"><div class="inv-count" id="inv-count"></div><div id="inv-list"></div></div>
</div>
<div id="page-rentals">
  <div id="rent-toolbar">
    <div class="rent-header-row">
      <div style="font-weight:700;font-size:15px">Rental History</div>
      <button class="btn-amber" style="padding:6px 12px;font-size:12px;font-weight:800;border:none;border-radius:8px" onclick="openNewRental()">+ New</button>
    </div>
    <div class="chip-row">
      <button class="chip active-green" data-rf="active" onclick="setRentalFilter(this)">Active</button>
      <button class="chip" data-rf="returned" onclick="setRentalFilter(this)">Returned</button>
      <button class="chip" data-rf="all" onclick="setRentalFilter(this)">All</button>
    </div>
  </div>
  <div style="padding:8px 14px 0" id="rent-list"></div>
</div>
<div id="bottom-nav">
  <button class="nav-btn active" data-page="dashboard" onclick="showTab(this)"><span class="nav-icon">⚡</span><span class="nav-label">Dashboard</span><div class="nav-dot"></div></button>
  <button class="nav-btn" data-page="inventory" onclick="showTab(this)"><span class="nav-icon">🗃️</span><span class="nav-label">Inventory</span></button>
  <button class="nav-btn" data-page="rentals" onclick="showTab(this)"><span class="nav-icon">📋</span><span class="nav-label">Rentals</span></button>
</div>
<!-- MODAL: Edit Item -->
<div class="modal-overlay" id="modal-item">
  <div class="modal-sheet">
    <div class="modal-header"><div class="modal-title" id="modal-item-title">Add Item</div><button class="modal-close" onclick="closeModal('modal-item')">✕</button></div>
    <div class="field"><label class="field-label">NAME</label><input class="field-input" id="fi-name"/></div>
    <div class="grid-2">
      <div class="field"><label class="field-label">CATEGORY</label><select class="field-input" id="fi-cat"><option>Power Tools</option><option>Hand Tools</option><option>Ladders</option><option>Pumps</option><option>Compressors</option><option>Hoses & Pipes</option><option>Scaffolding</option><option>Concrete</option><option>Safety</option><option>Welding</option><option>Containers</option><option>Electrical</option><option>Heavy Equipment</option><option>Other</option></select></div>
      <div class="field"><label class="field-label">SIZE / TYPE</label><input class="field-input" id="fi-size" placeholder="e.g. small, 10'"/></div>
    </div>
    <div class="grid-2">
      <div class="field"><label class="field-label">QTY</label><input class="field-input" id="fi-qty" type="number" min="1" value="1"/></div>
      <div class="field"><label class="field-label">DAILY RATE (LKR)</label><input class="field-input" id="fi-rate" type="number" min="0" value="0"/></div>
    </div>
    <div class="field"><label class="field-label">COLOR</label><input class="field-input" id="fi-color" placeholder="e.g. red, yellow"/></div>
    <div class="field"><label class="field-label">NOTES</label><input class="field-input" id="fi-spec" placeholder="Additional notes"/></div>
    <div class="field"><label class="field-label">STATUS</label><select class="field-input" id="fi-status"><option value="available">Available</option><option value="rented">Rented</option><option value="maintenance">Maintenance</option></select></div>
    <button class="btn-primary" id="fi-save-btn" onclick="saveItem()">Add Item</button>
    <button class="btn-danger" id="fi-delete-btn" onclick="deleteItem()" style="display:none">Delete Item</button>
  </div>
</div>
<!-- MODAL: New Rental -->
<div class="modal-overlay" id="modal-rental">
  <div class="modal-sheet">
    <div class="modal-header"><div class="modal-title">New Rental</div><button class="modal-close" onclick="closeModal('modal-rental')">✕</button></div>
    <div id="rental-no-items" style="display:none;text-align:center;padding:24px;color:var(--muted)">No available items. Add items first.</div>
    <div id="rental-form">
      <div class="field"><label class="field-label">ITEM</label><select class="field-input" id="nr-item" onchange="updateRentalCalc()"></select></div>
      <div class="field"><label class="field-label">CUSTOMER NAME</label><input class="field-input" id="nr-name"/></div>
      <div class="field"><label class="field-label">PHONE</label><input class="field-input" id="nr-phone" type="tel"/></div>
      <div class="grid-2">
        <div class="field"><label class="field-label">START DATE</label><input class="field-input" id="nr-start" type="date" onchange="updateRentalCalc()"/></div>
        <div class="field"><label class="field-label">DUE DATE</label><input class="field-input" id="nr-due" type="date" onchange="updateRentalCalc()"/></div>
      </div>
      <div class="field"><label class="field-label">DEPOSIT (LKR)</label><input class="field-input" id="nr-deposit" type="number" min="0" placeholder="0"/></div>
      <div class="total-box" id="nr-total-box" style="display:none"><div class="total-calc" id="nr-calc"></div><div class="total-amount" id="nr-total"></div></div>
      <button class="btn-primary" onclick="confirmRental()">Confirm Rental</button>
    </div>
  </div>
</div>
<!-- MODAL: Return -->
<div class="modal-overlay" id="modal-return">
  <div class="modal-sheet">
    <div class="modal-header"><div class="modal-title">Process Return</div><button class="modal-close" onclick="closeModal('modal-return')">✕</button></div>
    <div class="summary-box">
      <div style="font-weight:700" id="ret-item-name"></div>
      <div style="color:#94a3b8;font-size:12px;margin-top:2px" id="ret-customer"></div>
      <div style="color:var(--muted);font-size:11px;margin-top:2px" id="ret-dates"></div>
      <div style="color:var(--red);font-size:11px;font-weight:700;margin-top:4px" id="ret-overdue-msg"></div>
    </div>
    <div class="field"><label class="field-label">RETURN DATE</label><input class="field-input" id="ret-date" type="date" onchange="updateReturnCalc()"/></div>
    <div class="summary-box">
      <div class="summary-row"><span class="lbl">Duration</span><span id="ret-days"></span></div>
      <div class="summary-row"><span class="lbl">Daily Rate</span><span id="ret-rate"></span></div>
      <div class="summary-row"><span class="lbl">Deposit Paid</span><span id="ret-deposit"></span></div>
      <div class="summary-divider"><span style="font-weight:700">Total Due</span><span class="summary-total" id="ret-total"></span></div>
    </div>
    <button class="btn-primary" id="ret-confirm-btn" onclick="confirmReturn()">✓ Confirm Return</button>
  </div>
</div>
<script>
let items=JSON.parse(localStorage.getItem('dh_items')||'[]');
let rentals=JSON.parse(localStorage.getItem('dh_rentals')||'[]');
let editingItemId=null,returningRentalId=null,statusFilter='All',catFilter='All',rentalFilter='active';
const CATS=['All','Power Tools','Hand Tools','Ladders','Pumps','Compressors','Hoses & Pipes','Scaffolding','Concrete','Safety','Welding','Containers','Electrical','Heavy Equipment','Other'];
function save(){localStorage.setItem('dh_items',JSON.stringify(items));localStorage.setItem('dh_rentals',JSON.stringify(rentals));}
function today(){return new Date().toISOString().split('T')[0];}
function daysBetween(a,b){return Math.max(1,Math.ceil((new Date(b)-new Date(a))/86400000));}
function isOverdue(d){return new Date(d)<new Date(today());}
function fmt(n){return n>0?Number(n).toLocaleString():'—';}
function fmtMoney(n){return Number(n).toLocaleString()+' LKR';}
function badgeClass(s){return s==='available'?'badge-available':s==='rented'?'badge-rented':'badge-maintenance';}
function badgeLabel(s){return s==='available'?'Available':s==='rented'?'Rented':'Maintenance';}
function showTab(btn){document.querySelectorAll('.nav-btn').forEach(b=>{b.classList.remove('active');b.querySelector('.nav-dot')?.remove();});btn.classList.add('active');const dot=document.createElement('div');dot.className='nav-dot';btn.appendChild(dot);const p=btn.dataset.page;document.querySelectorAll('.page').forEach(pg=>pg.classList.remove('active'));document.getElementById('page-'+p).classList.add('active');}
function buildCatChips(){const row=document.getElementById('cat-chips');row.innerHTML=CATS.map(c=>`<button class="chip${c===catFilter?' active-blue':''}" data-cat="${c}" onclick="setCatFilter(this)">${c}</button>`).join('');}
function setCatFilter(btn){catFilter=btn.dataset.cat;document.querySelectorAll('#cat-chips .chip').forEach(b=>b.classList.remove('active-blue'));btn.classList.add('active-blue');renderInventory();}
function setStatusFilter(btn){statusFilter=btn.dataset.status;document.querySelectorAll('#status-chips .chip').forEach(b=>b.classList.remove('active-green'));btn.classList.add('active-green');renderInventory();}
function setRentalFilter(btn){rentalFilter=btn.dataset.rf;document.querySelectorAll('#rent-toolbar .chip').forEach(b=>b.classList.remove('active-green'));btn.classList.add('active-green');renderRentals();}
function renderDashboard(){const av=items.filter(i=>i.status==='available').length;const re=items.filter(i=>i.status==='rented').length;const ma=items.filter(i=>i.status==='maintenance').length;document.getElementById('stat-available').textContent=av;document.getElementById('stat-rented').textContent=re;document.getElementById('stat-maint').textContent=ma;const ar=rentals.filter(r=>r.status==='active');const rev=ar.reduce((s,r)=>{const d=daysBetween(r.startDate,today());return s+(d*r.dailyRate);},0);document.getElementById('dash-revenue').textContent=fmtMoney(rev);document.getElementById('dash-active-count').textContent=ar.length+' active rental'+(ar.length===1?'':'s');const od=ar.filter(r=>isOverdue(r.dueDate));let odsec='';if(od.length>0){odsec=`<div class="overdue-section"><div class="overdue-title">⚠️ ${od.length} Overdue Rental${od.length===1?'':'s'}</div>${od.map(r=>`<div class="overdue-item"><div class="overdue-info"><div class="name">${r.itemName}</div><div class="sub">${r.customerName}</div></div><button class="btn-green" style="padding:4px 12px;font-size:11px" onclick="openReturn(${r.id})">Return</button></div>`).join('')}</div>`;}document.getElementById('dash-overdue-section').innerHTML=odsec;const banner=document.getElementById('overdue-banner');if(od.length>0){banner.textContent=`⚠️ ${od.length} overdue rental${od.length===1?'':'s'}`;banner.style.display='block';}else{banner.style.display='none';}document.getElementById('dash-active-list').innerHTML=ar.length===0?emptyHTML('📦','No active rentals'):ar.map(rentalCardHTML).join('');}
function renderInventory(){buildCatChips();const q=(document.getElementById('search-input').value||'').toLowerCase();const filtered=items.filter(i=>{const mQ=!q||i.name.toLowerCase().includes(q)||String(i.id).includes(q)||i.size.toLowerCase().includes(q);const sts=statusFilter==='All'||i.status===statusFilter;const cat=catFilter==='All'||i.category===catFilter;return mQ&&sts&&cat;});const el=document.getElementById('inv-list');el.innerHTML=filtered.length===0?emptyHTML('📦','No items found'):filtered.map(i=>{const il=rentals.filter(r=>r.itemId===i.id&&r.status==='active').reduce((s,r)=>s+1,0);const al=i.qty-il;return `<div class="item-card"><div class="card-top"><div><div class="card-id">#${i.id}</div><div class="card-name">${i.name}</div><div class="card-meta">${i.category} • ${i.size}</div><div class="card-spec">${i.color}${i.spec?` • ${i.spec}`:''}</div></div><span class="status-badge ${badgeClass(i.status)}">${badgeLabel(i.status)}</span></div><div class="card-bottom"><div><span class="card-rate">${fmtMoney(i.rate)}<span>/day</span></span><span class="card-qty">${al}/${i.qty}</span></div><div class="btn-row"><button class="btn-sm" onclick="openEditItem(${i.id})">Edit</button><button class="btn-green" onclick="openNewRental(${i.id})">Rent</button></div></div></div>`}).join('');document.getElementById('inv-count').textContent=`${filtered.length} item${filtered.length===1?'':'s'}`;}
function renderRentals(){const list=rentals.filter(r=>rentalFilter==='all'||r.status===rentalFilter);const el=document.getElementById('rent-list');if(list.length===0){el.innerHTML=emptyHTML('📋','No rentals found');return;}el.innerHTML=list.map(rentalCardHTML).join('');}
function rentalCardHTML(r){const od=r.status==='active'&&isOverdue(r.dueDate);const days=r.returnDate?daysBetween(r.startDate,r.returnDate):daysBetween(r.startDate,today());const amt=days*r.dailyRate;return `<div class="rental-card" style="${od?'border-color:var(--red)':''}"><div class="rental-card-left"><div class="r-name">${r.itemName}</div><div class="r-customer">${r.customerName}</div><div class="r-dates">${r.startDate} → ${r.dueDate}${r.returnDate?` (Ret: ${r.returnDate}):'''}</div>${od?'<div style="color:var(--red);font-size:11px;font-weight:700;margin-top:4px">OVERDUE</div>':''}</div><div class="r-right"><div class="r-amount">${fmtMoney(amt)}</div><div class="r-days">${days} day${days===1?'':'s'}</div>${r.status==='active'?`<button class="btn-return" onclick="openReturn(${r.id})">Return</button>`:''}</div></div>`;}
function openEditItem(id){editingItemId=id;const item=id?items.find(i=>i.id===id):{name:'',category:'Power Tools',size:'',qty:1,rate:0,color:'',spec:'',status:'available'};document.getElementById('modal-item-title').textContent=id?'Edit Item':'Add Item';document.getElementById('fi-name').value=item.name;document.getElementById('fi-cat').value=item.category;document.getElementById('fi-size').value=item.size;document.getElementById('fi-qty').value=item.qty;document.getElementById('fi-rate').value=item.rate;document.getElementById('fi-color').value=item.color;document.getElementById('fi-spec').value=item.spec;document.getElementById('fi-status').value=item.status;document.getElementById('fi-save-btn').textContent=id?'Update Item':'Add Item';document.getElementById('fi-delete-btn').style.display=id?'block':'none';openModal('modal-item');}
function saveItem(){const name=document.getElementById('fi-name').value.trim();if(!name){alert('Item name is required');return;}const data={name,category:document.getElementById('fi-cat').value,size:document.getElementById('fi-size').value,qty:parseInt(document.getElementById('fi-qty').value),rate:parseFloat(document.getElementById('fi-rate').value),color:document.getElementById('fi-color').value,spec:document.getElementById('fi-spec').value,status:document.getElementById('fi-status').value};if(editingItemId){const idx=items.findIndex(i=>i.id===editingItemId);items[idx]={...items[idx],...data};}else{data.id=items.length>0?Math.max(...items.map(i=>i.id))+1:1;items.push(data);}save();closeModal('modal-item');renderInventory();renderDashboard();}
function deleteItem(){if(!confirm('Delete this item?'))return;items=items.filter(i=>i.id!==editingItemId);save();closeModal('modal-item');renderInventory();renderDashboard();}
function openNewRental(preId){const avail=items.filter(i=>i.status==='available');const noItems=document.getElementById('rental-no-items');const form=document.getElementById('rental-form');if(avail.length===0){noItems.style.display='block';form.style.display='none';}else{noItems.style.display='none';form.style.display='block';const sel=document.getElementById('nr-item');sel.innerHTML=avail.map(i=>`<option value="${i.id}" data-rate="${i.rate}">${i.name} - ${i.size}</option>`).join('');if(preId){sel.value=preId;}document.getElementById('nr-name').value='';document.getElementById('nr-phone').value='';document.getElementById('nr-start').value=today();document.getElementById('nr-due').value='';document.getElementById('nr-deposit').value='0';document.getElementById('nr-total-box').style.display='none';updateRentalCalc();}openModal('modal-rental');}
function updateRentalCalc(){const start=document.getElementById('nr-start').value;const due=document.getElementById('nr-due').value;const sel=document.getElementById('nr-item');const rate=parseFloat(sel.options[sel.selectedIndex].dataset.rate);if(!start||!due){document.getElementById('nr-total-box').style.display='none';return;}const days=daysBetween(start,due);const daily=days*rate;const deposit=parseFloat(document.getElementById('nr-deposit').value)||0;const total=daily+deposit;document.getElementById('nr-calc').textContent=`${days} day${days===1?'':'s'} × ${fmtMoney(rate)}/day + ${fmtMoney(deposit)} deposit`;document.getElementById('nr-total').textContent=fmtMoney(total);document.getElementById('nr-total-box').style.display='block';}
function confirmRental(){const customerName=document.getElementById('nr-name').value.trim();const dueDate=document.getElementById('nr-due').value;if(!customerName||!dueDate){alert('Fill in customer name and due date');return;}const sel=document.getElementById('nr-item');const itemId=parseInt(sel.value);const item=items.find(i=>i.id===itemId);const r={id:rentals.length>0?Math.max(...rentals.map(r=>r.id))+1:1,itemId,itemName:item.name,customerName,phone:document.getElementById('nr-phone').value,startDate:document.getElementById('nr-start').value,dueDate,deposit:parseFloat(document.getElementById('nr-deposit').value)||0,dailyRate:item.rate,status:'active',returnDate:null};rentals.push(r);items.find(i=>i.id===itemId).status='rented';save();closeModal('modal-rental');renderInventory();renderDashboard();renderRentals();}
function openReturn(rentalId){returningRentalId=rentalId;const r=rentals.find(x=>x.id===rentalId);document.getElementById('ret-item-name').textContent=r.itemName;document.getElementById('ret-customer').textContent=`Customer: ${r.customerName} | ${r.phone}`;document.getElementById('ret-dates').textContent=`Rented: ${r.startDate} → Due: ${r.dueDate}`;const od=isOverdue(r.dueDate);document.getElementById('ret-overdue-msg').textContent=od?`⚠️ OVERDUE by ${daysBetween(r.dueDate,today())} day${daysBetween(r.dueDate,today())===1?'':'s'}!`:'';document.getElementById('ret-date').value=today();updateReturnCalc();openModal('modal-return');}
function updateReturnCalc(){const r=rentals.find(x=>x.id===returningRentalId);if(!r)return;const rd=document.getElementById('ret-date').value||today();const days=daysBetween(r.startDate,rd);const total=days*r.dailyRate;document.getElementById('ret-days').textContent=days;document.getElementById('ret-rate').textContent=fmtMoney(r.dailyRate);document.getElementById('ret-deposit').textContent=fmtMoney(r.deposit);document.getElementById('ret-total').textContent=fmtMoney(total);}
function confirmReturn(){const rd=document.getElementById('ret-date').value||today();const r=rentals.find(x=>x.id===returningRentalId);rentals=rentals.map(x=>x.id===returningRentalId?{...x,status:'returned',returnDate:rd}:x);const item=items.find(i=>i.id===r.itemId);item.status='available';save();closeModal('modal-return');renderInventory();renderDashboard();renderRentals();}
function openModal(id){document.getElementById(id).classList.add('open');}
function closeModal(id){document.getElementById(id).classList.remove('open');}
document.querySelectorAll('.modal-overlay').forEach(el=>{el.addEventListener('click',e=>{if(e.target===el)el.classList.remove('open');});});
function emptyHTML(icon,text){return `<div class="empty"><div class="empty-icon">${icon}</div><div class="empty-txt">${text}</div></div>`;}
buildCatChips();renderDashboard();renderInventory();
</script>
</body>
</html>
